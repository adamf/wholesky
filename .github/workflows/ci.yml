# Boots real worlds on real sockets under the race detector. jetway is
# pinned by tag, so a plain checkout builds; when a replace directive points
# at a side-by-side checkout during development, CI still passes because the
# directive never lands on main.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: compile a world
        run: go run ./cmd/worldc -countries "United Kingdom,France" -carriers 6 -o /tmp/ci-world.json
      - name: test (race)
        run: go test -race -count=1 -timeout 10m ./...
