# What differs between deployments of the same image: where the world is
# reached, what it is called, how much demand and how many shards. The
# link secret is a Secret (see the README), never here.
# The core alone may be reached from outside the namespace, and only by
# the edge; the world's machines talk among themselves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: world
  namespace: wholesky
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: wholesky}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: wholesky}}
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: envoy}}
      ports:
        - {port: 8080}
        - {port: 7000}
        - {port: 7001}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: wholesky
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: envoy}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8443}
        - {port: 8080}
        - {port: 7000}
        - {port: 7001}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
  namespace: wholesky
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: envoy}
