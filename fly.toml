# Fly.io deployment for the public demo: the whole sky, across machines.
#
# Six machines from one image: the switch and its instruments on core (the
# only public one), a distribution system per gds machine carrying real
# reservations volume, and the five hundred carriers sharded across two
# regions. Every link between them is the same jetway TCP that loopback
# used, dialled across the private network.

app = "wholesky-demo"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Per-role soft limits ride the -memlimit flag; nothing app-wide.

# The world across machines: the switch and the instruments on core, one
# distribution system per gds machine carrying its share of real-volume
# demand, and the carrier tenants sharded across two regions. Only the core
# is public; everything else talks over the private network -- the same
# jetway TCP that loopback used, dialled across 6PN.
[processes]
  core = "-world /etc/wholesky/whole.json -memlimit 3200MiB -role core -carriers 0 -console 0.0.0.0:8080 -advertise core.process.wholesky-demo.internal -link-bind :: -max-messages 2000 -max-records 4000 -stats-snapshot /tmp/wholesky-stats.json"
  gds1g = "-world /etc/wholesky/whole.json -memlimit 3200MiB -seed 1 -role gds -gds-designator 1G -carriers 0 -console 0.0.0.0:8080 -core-url http://core.process.wholesky-demo.internal:8080 -demand 1170 -max-messages 2000 -max-records 8000"
  gds1s = "-world /etc/wholesky/whole.json -memlimit 3200MiB -seed 2 -role gds -gds-designator 1S -carriers 0 -console 0.0.0.0:8080 -core-url http://core.process.wholesky-demo.internal:8080 -demand 1170 -max-messages 2000 -max-records 8000"
  gds1a = "-world /etc/wholesky/whole.json -memlimit 3200MiB -seed 3 -role gds -gds-designator 1A -carriers 0 -console 0.0.0.0:8080 -core-url http://core.process.wholesky-demo.internal:8080 -demand 1170 -max-messages 2000 -max-records 8000"
  region0 = "-world /etc/wholesky/whole.json -memlimit 3200MiB -gds-list 1G,1S,1A -role region -shard 0 -shards 2 -carriers 0 -console 0.0.0.0:8080 -core-url http://core.process.wholesky-demo.internal:8080 -avs-interval 60s -max-messages 2000 -max-records 4000 -tenant-max-messages 300 -tenant-max-records 800"
  region1 = "-world /etc/wholesky/whole.json -memlimit 3200MiB -gds-list 1G,1S,1A -role region -shard 1 -shards 2 -carriers 0 -console 0.0.0.0:8080 -core-url http://core.process.wholesky-demo.internal:8080 -avs-interval 60s -max-messages 2000 -max-records 4000 -tenant-max-messages 300 -tenant-max-records 800"

[http_service]
  processes = ["core"]
  internal_port = 8080
  force_https = true
  # Always on. A world this size takes a minute of boot to stand its five
  # hundred links up, and the first visitor should meet a sky, not a boot
  # screen. (Scale-to-zero also could not suspend a 4GB machine; every idle
  # wake was a cold start.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

  # The console holds an event-stream open; /healthz answers immediately.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# The whole sky idles around 1.1GB and spends CPU on the morning banks; two
# shared cores and 2GB carry it at warp 60.
# Dedicated cores everywhere: the shared tier's burst credits ran out under
# the full world once, and the machine was throttled to a sliver.
[[vm]]
  processes = ["core"]
  size = "performance-2x"
  memory = "4096mb"

[[vm]]
  processes = ["gds1g", "gds1s", "gds1a"]
  size = "performance-1x"
  memory = "4096mb"

[[vm]]
  processes = ["region0", "region1"]
  size = "performance-2x"
  memory = "4096mb"
