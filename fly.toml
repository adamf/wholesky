# Fly.io deployment for the public demo: a European sky, running continuously.
#
# Only the switch console is published. The carriers, the GDS and the switch
# all live in this one container, talking over loopback TCP -- which is the
# same reason the jetway demo fits a container and would not fit a function
# platform.

app = "wholesky-demo"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Two world-sized availability caches plus five hundred bounded ledgers
  # want headroom discipline: keep the runtime's ceiling under the machine's.
  GOMEMLIMIT = "3400MiB"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on. A world this size takes a minute of boot to stand its five
  # hundred links up, and the first visitor should meet a sky, not a boot
  # screen. (Scale-to-zero also could not suspend a 4GB machine; every idle
  # wake was a cold start.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

  # The console holds an event-stream open; /healthz answers immediately.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# The whole sky idles around 1.1GB and spends CPU on the morning banks; two
# shared cores and 2GB carry it at warp 60.
[[vm]]
  # Dedicated cores. The shared tier's burst credits ran out under the full
  # world and the machine was throttled to a sliver -- /proc/stat showed six
  # times more stolen jiffies than worked ones, and every request starved.
  size = "performance-2x"
  memory = "4096mb"
